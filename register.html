<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | Ubuntu Captions</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black text-white overflow-hidden">

  <!-- Background -->
  <div class="absolute inset-0">

    <img src="assets/images/wedd/wed15.jpg"
    class="w-full h-full object-cover"
    alt="wed">

    <div class="absolute inset-0 bg-black/75"></div>

  </div>

  <!-- Container -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-6">

    <!-- card -->
<div class="w-full max-w-md bg-black/40 backdrop-blur-lg border border-white/10 rounded-3xl p-8">

  <!-- Logo -->
  <div class="text-center mb-8">

    <h1 class="text-3xl font-bold text-yellow-400 mb-2">
      Ubuntu Captions
    </h1>

    <p class="text-gray-400 text-sm">
      Create your cinematic photography account.
    </p>

  </div>

  <!-- Form -->
  <form action="categories.html" class="space-y-5">

    <!-- Name -->
    <div>

      <input type="text"
      placeholder="Full Name"
      class="w-full bg-white/10 border border-white/10 rounded-2xl px-4 py-3 outline-none focus:border-yellow-400">

    </div>

    <!-- Email -->
    <div>

      <input type="email"
      placeholder="Email Address"
      class="w-full bg-white/10 border border-white/10 rounded-2xl px-4 py-3 outline-none focus:border-yellow-400">

    </div>

    <!-- Password -->
    <div>

      <input type="password"
      placeholder="Password"
      class="w-full bg-white/10 border border-white/10 rounded-2xl px-4 py-3 outline-none focus:border-yellow-400">

    </div>

    <!-- Confirm Password -->
    <div>

      <input type="password"
      placeholder="Confirm Password"
      class="w-full bg-white/10 border border-white/10 rounded-2xl px-4 py-3 outline-none focus:border-yellow-400">

    </div>

    <!-- Terms -->
    <label class="flex items-center gap-2 text-sm text-gray-300">

      <input type="checkbox" class="accent-yellow-400">

      I agree to the terms

    </label>

    <!-- Button -->
    <button
    class="w-full bg-yellow-400 text-black py-3 rounded-2xl font-semibold hover:scale-[1.02] transition">

      Create Account

    </button>

  </form>

  <!-- Login -->
  <p class="text-center text-gray-400 text-sm mt-6">

    Already have an account?

    <a href="login.html"
    class="text-yellow-400 hover:underline">

      Login

    </a>

  </p>

</div>
</body>
</html>
