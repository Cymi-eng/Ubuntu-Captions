<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ubuntu Captions</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>

    @keyframes fade {

      0%{
        opacity:0;
      }

      10%{
        opacity:1;
      }

      30%{
        opacity:1;
      }

      40%{
        opacity:0;
      }

      100%{
        opacity:0;
      }

    }

  </style>

</head>

<body class="bg-black text-white overflow-x-hidden">

  <!-- Navbar -->
  <nav class="absolute top-0 left-0 w-full z-30 backdrop-blur-md bg-black/20">

    <div class="max-w-7xl mx-auto flex items-center justify-between px-6 md:px-10 py-5">

      <!-- Logo -->
      <h1 class="text-2xl md:text-3xl font-bold text-yellow-400 tracking-wide">
        Ubuntu Captions
      </h1>

      <!-- Nav Links -->
      <ul class="hidden md:flex gap-8 uppercase text-sm tracking-widest">

        <li class="relative">
          <a href="#" class="text-yellow-400">
            Home
          </a>

          <span class="absolute left-0 -bottom-2 w-full h-[2px] bg-yellow-400 rounded-full"></span>
        </li>

        <li>
          <a href="#" class="hover:text-yellow-400 transition duration-300">
            Captions
          </a>
        </li>

        <li>
          <a href="#" class="hover:text-yellow-400 transition duration-300">
            Categories
          </a>
        </li>

        <li>
          <a href="#" class="hover:text-yellow-400 transition duration-300">
            About
          </a>
        </li>

        <li>
          <a href="#" class="hover:text-yellow-400 transition duration-300">
            Contact
          </a>
        </li>

      </ul>

      <!-- Mobile Menu Icon -->
      <button class="md:hidden text-3xl text-yellow-400">
        ☰
      </button>

    </div>

  </nav>

  <!-- Hero Section -->
  <section class="relative h-screen overflow-hidden">

    <!-- Slides -->
    <div class="absolute inset-0">

      <img src="assets/images/safari&wildlife/eagle.jpg"
      class="absolute w-full h-full object-cover animate-[fade_15s_infinite]"
      alt="eagle">

      <img src="assets/images/outdoor/out13.jpg"
      class="absolute w-full h-full object-cover animate-[fade_15s_infinite_5s]"
      alt="child">

      <img src="assets/images/wedd/wed15.jpg"
      class="absolute w-full h-full object-cover animate-[fade_15s_infinite_10s]"
      alt="wedd">

      <img src="assets/images/safari&wildlife/3 twiga.jpg"
      class="absolute w-full h-full object-cover animate-[fade_15s_infinite_10s]"
      alt="wedd">
      <img src="assets/images/wedd/wedd 1.jpg"
      class="absolute w-full h-full object-cover animate-[fade_15s_infinite_10s]"
      alt="wedd">

    </div>

    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-black/70"></div>

    <!-- Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent"></div>

    <!-- Hero Content -->
    <div class="relative z-20 flex flex-col items-center justify-center text-center h-full px-6">

      <p class="uppercase tracking-[6px] md:tracking-[10px] text-yellow-400 text-xs md:text-sm mb-5 animate-pulse">
        Capture Moments with Ubuntu Captions
      </p>

      <h1 class="text-4xl sm:text-5xl md:text-7xl font-extrabold leading-tight mb-6">

        Capturing Stories <br>

        <span class="text-yellow-400">
          Through The Lens
        </span>

      </h1>

      <p class="max-w-2xl text-gray-300 text-base md:text-xl leading-relaxed mb-10">

        Wildlife, weddings, portraits, and timeless cinematic moments
        crafted through creativity and emotion.

      </p>

      <!-- Buttons -->
      <div class="flex flex-col sm:flex-row gap-5">

        <a href="categories.html"
        class="bg-yellow-400 text-black px-8 py-4 rounded-full font-semibold hover:scale-105 transition duration-300 shadow-2xl shadow-yellow-500/20">

          Explore Gallery

        </a>

        <a href="#"
        class="border border-white px-8 py-4 rounded-full hover:bg-white hover:text-black transition duration-300">

          Book Session

        </a>

      </div>

    </div>

    <!-- Scroll Indicator -->
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 animate-bounce">

      <div class="w-7 h-12 border-2 border-white rounded-full flex justify-center">

        <div class="w-1 h-3 bg-white rounded-full mt-2"></div>

      </div>

    </div>

  </section>

</body>
</html>
