<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Ubuntu Captions</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black text-white overflow-hidden">

  <!-- Background -->
  <div class="absolute inset-0">

    <img src="assets/images/outdoor/out13.jpg"
    class="w-full h-full object-cover"
    alt="">

    <div class="absolute inset-0 bg-black/75"></div>

  </div>

  <!-- Container -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-6">

    <!-- Card -->
    <div class="w-full max-w-md backdrop-blur-xl bg-white/10 border border-white/20 rounded-[35px] p-10 shadow-2xl">

      <!-- Logo -->
      <div class="text-center mb-10">

        <h1 class="text-4xl font-extrabold text-yellow-400 mb-3">
          Ubuntu Captions
        </h1>

        <p class="text-gray-400">
          Welcome back to cinematic storytelling.
        </p>

      </div>

      <!-- Form -->
      <form action="categories.html" class="space-y-6">

        <!-- Email -->
        <div>

          <label class="block text-sm mb-3 text-gray-300">
            Email Address
          </label>

          <input type="email"
          placeholder="Enter your email"
          class="w-full bg-white/10 border border-white/10 rounded-2xl px-5 py-4 outline-none focus:border-yellow-400 transition">

        </div>

        <!-- Password -->
        <div>

          <label class="block text-sm mb-3 text-gray-300">
            Password
          </label>

          <input type="password"
          placeholder="Enter your password"
          class="w-full bg-white/10 border border-white/10 rounded-2xl px-5 py-4 outline-none focus:border-yellow-400 transition">

        </div>

        <!-- Options -->
        <div class="flex items-center justify-between text-sm">

          <label class="flex items-center gap-2 text-gray-300">

            <input type="checkbox"
            class="accent-yellow-400">

            Remember Me

          </label>

          <a href="#"
          class="text-yellow-400 hover:underline">

            Forgot Password?

          </a>

        </div>

        <!-- Button -->
        <button
        class="w-full bg-yellow-400 text-black py-4 rounded-2xl font-bold hover:scale-[1.02] transition duration-300">

          Sign In

        </button>

      </form>

      <!-- Divider -->
      <div class="flex items-center gap-4 my-8">

        <div class="h-[1px] bg-white/10 flex-1"></div>

        <span class="text-gray-400 text-sm">
          OR
        </span>

        <div class="h-[1px] bg-white/10 flex-1"></div>

      </div>

      <!-- Social -->
      <div class="grid grid-cols-2 gap-4">

        <button
        class="bg-white/10 border border-white/10 py-4 rounded-2xl hover:bg-white/20 transition">

          Google

        </button>

        <button
        class="bg-white/10 border border-white/10 py-4 rounded-2xl hover:bg-white/20 transition">

          Facebook

        </button>

      </div>

      <!-- Register -->
      <p class="text-center text-gray-400 mt-8">

        Don’t have an account?

        <a href="register.html"
        class="text-yellow-400 hover:underline">

          Register

        </a>

      </p>

    </div>

  </div>

</body>
</html>
